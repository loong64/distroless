name: Release

on:
  workflow_dispatch: # Allow manual runs.
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

jobs:
  ci-images:
    name: CI image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_root/cache
          key: bazel-cache-deps-${{ github.sha }}
          restore-keys: |
            bazel-cache-deps-${{ github.sha }}
            bazel-cache-deps-

      - uses: google-github-actions/auth@v3
        with:
          service_account: ${{ secrets.KEYLESS }}
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Setup build tools
        run: |
          sudo wget -qO /usr/local/bin/bazelisk https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo wget -qO /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          wget -qO- https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | sudo tar -xzf - -C /usr/local/bin/ crane
          sudo chmod +x /usr/local/bin/bazelisk /usr/local/bin/cosign /usr/local/bin/crane

      - name: Build Image
        run: |
          for i in $(seq 5); do 
            bazelisk cquery 'kind(merge_providers, deps(kind(oci_image, ...)))' --output=label --config=release && break || sleep 20;
          done

      - name: Push Image
        run: bazelisk run :sign_and_push --config=release -- --keyless $KEYLESS
        env:
          REGISTRY: ghcr.io
          PROJECT_ID: ${{ github.repository }}
          KEYLESS: ${{ secrets.KEYLESS }}
